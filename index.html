    <script>
      (function () {
        var VALID = ["blue-black", "white-blue", "white-green", "black-purple", "white-orange", "black-pink", "white-red", "black-gold", "white-indigo", "black-teal", "cream-brown", "dark-emerald", "black-red", "slate-amber", "navy-gold", "white-teal", "black-orange", "white-violet"];
        var KEY = "bb-site-theme";
        function applyTheme(t) {
          if (VALID.indexOf(t) > -1) {
            document.documentElement.setAttribute("data-theme", t);
            if (document.body) {
              var meta = document.querySelector('meta[name="theme-color"]');
              if (meta) {
                var c = getComputedStyle(document.body).backgroundColor;
                if (c && c !== "rgba(0, 0, 0, 0)") meta.setAttribute("content", c);
              }
            }
          }
        }
        try {
          var cached = localStorage.getItem(KEY);
          if (cached) applyTheme(cached);
        } catch (e) {}
        var url = "%VITE_SUPABASE_URL%";
        var key = "%VITE_SUPABASE_ANON_KEY%";
        if (!url || !key) return;
        fetch(url + "/rest/v1/site_settings?key=eq.theme_palette&select=value", {
          headers: { apikey: key, Authorization: "Bearer " + key }
        })
          .then(function (r) {
            return r.json();
          })
          .then(function (rows) {
            var t = rows && rows.length ? rows[0].value : null;
            if (typeof t === "string") {
              applyTheme(t);
              try {
                localStorage.setItem(KEY, t);
              } catch (e) {}
            }
          })
          .catch(function () {});
      })();
    </script>
